[tox]
envlist = lint,pytest
# tox-uv builds every env with uv, which hardlinks from the shared uv cache
# instead of copying a few hundred MB per env.
requires = tox-uv>=1.26
skipsdist = false

[gh-actions]
python =
  3.12: pytest, lint

[testenv]
basepython = python3
package = wheel
wheel_build_env = .pkg

[testenv:pytest]
dependency_groups = dev
commands =
  pytest --verbose                 \
         --strict                  \
         --cov=girder_jsonforms    \
         --cov-report=xml          \
         -n {env:PYTEST_XDIST_N:4} \
         {posargs}

[testenv:lint]
skip_install = true
skipdist = true
deps =
  ruff
commands =
  ruff check .
